<!doctype html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Erro interno</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .pagina {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: 600px;
            padding: 40px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .codigo {
            font-size: 55px;
            font-weight: bold;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        .botao {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-decoration: none;
            color: #222;
        }

    </style>

</head>

<body>

<div class="pagina">

    <div class="card">

        <div class="codigo">
            500
        </div>

        <h1>
            Não foi possível concluir a operação
        </h1>

        <p>
            O sistema encontrou um erro interno ao
            processar a solicitação.
        </p>

        <p>
            Nenhuma informação técnica do erro é
            apresentada nesta página por segurança.
        </p>

        {% if current_user.is_authenticated %}

    <a
        class="botao"
        href="{{ url_for('dashboard.index') }}"
    >
        Voltar para o sistema
    </a>

{% else %}

    <a
        class="botao"
        href="{{ url_for('auth.login') }}"
    >
        Ir para o login
    </a>

{% endif %}

    </div>

</div>

</body>

</html>
