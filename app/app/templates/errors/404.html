<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Página não encontrada</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .pagina {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: 600px;
            padding: 40px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .codigo {
            font-size: 55px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        .acoes {
            margin-top: 25px;
        }

        .botao {
            display: inline-block;
            padding: 11px 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-decoration: none;
            color: #222;
        }
    </style>
</head>

<body>

<div class="pagina">

    <div class="card">

        <div class="codigo">
            404
        </div>

        <h1>
            Página não encontrada
        </h1>

        <p>
            O endereço informado não existe ou
            o recurso não está mais disponível.
        </p>

        <div class="acoes">

            {% if current_user.is_authenticated %}

                <a
                    class="botao"
                    href="{{ url_for('dashboard.index') }}"
                >
                    Voltar para o sistema
                </a>

            {% else %}

                <a
                    class="botao"
                    href="{{ url_for('auth.login') }}"
                >
                    Ir para o login
                </a>

            {% endif %}

        </div>

    </div>

</div>

</body>

</html>
